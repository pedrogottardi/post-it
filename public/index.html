<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Post-it - Download</title>
  <meta name="description" content="Baixe o Post-it - App de lembretes simples e elegante para Android">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="/icon-512.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fef3c7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .container {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 8px 8px 0 0 #000;
      padding: clamp(20px, 5vh, 32px) clamp(16px, 4vw, 24px);
      max-width: 420px;
      width: 92%;
      text-align: center;
      display: flex;
      flex-direction: column;
      max-height: 100vh;
    }
    .logo {
      width: clamp(70px, 15vw, 90px);
      height: clamp(70px, 15vw, 90px);
      margin: 0 auto clamp(16px, 3vh, 20px);
      image-rendering: pixelated;
      flex-shrink: 0;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(24px, 6vw, 30px);
      font-weight: 700;
      color: #000;
      margin-bottom: clamp(4px, 1vh, 8px);
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .subtitle {
      color: #525252;
      margin-bottom: clamp(16px, 3vh, 24px);
      font-size: clamp(13px, 3vw, 15px);
      line-height: 1.4;
      flex-shrink: 0;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #facc15;
      border: 4px solid #000;
      color: #000;
      padding: clamp(14px, 3vh, 18px) clamp(16px, 4vw, 24px);
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(15px, 3.5vw, 17px);
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 6px 6px 0 0 #000;
      flex-shrink: 0;
    }
    .download-btn:hover { background: #eab308; transform: translate(3px, 3px); box-shadow: 3px 3px 0 0 #000; }
    .download-btn:active { transform: translate(6px, 6px); box-shadow: 0 0 0 0 #000; }
    .download-btn svg { width: 20px; height: 20px; stroke-width: 2.5; flex-shrink: 0; }
    .features {
      margin-top: clamp(16px, 3vh, 24px);
      padding-top: clamp(16px, 3vh, 24px);
      border-top: 3px solid #000;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 2vh, 12px);
      flex-shrink: 0;
      overflow: hidden;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: clamp(8px, 1.5vh, 12px) 0;
      color: #404040;
      font-size: clamp(12px, 2.5vw, 13px);
      font-weight: 500;
      text-align: left;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
    }
    .feature:last-child { border-bottom: none; }
    .feature svg { width: 18px; height: 18px; color: #000; flex-shrink: 0; stroke-width: 2.5; }
    
    @media (max-height: 500px) and (orientation: landscape) {
      .container { padding: clamp(12px, 3vh, 20px) clamp(12px, 3vw, 18px); }
      .logo { width: 55px; height: 55px; margin-bottom: 10px; }
      h1 { font-size: 20px; margin-bottom: 4px; }
      .subtitle { font-size: 12px; margin-bottom: 12px; }
      .download-btn { padding: 12px 16px; font-size: 14px; }
      .features { margin-top: 12px; padding-top: 12px; gap: 6px; }
      .feature { padding: 6px 0; font-size: 11px; gap: 8px; }
      .feature svg { width: 16px; height: 16px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="Post-it Logo">
    </div>
    <h1>Post-it</h1>
    <p class="subtitle">Lembretes simples, rápidos e sem distrações para Android</p>

    <a href="https://github.com/pedrogottardi/post-it/releases/latest" class="download-btn" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Baixar APK
    </a>

    <div class="features">
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        Lembretes com data e hora
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        Calendário visual mensal
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
        </svg>
        Backup e Importar JSON
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        Notificações locais
      </div>
    </div>
  </div>
</body>
</html>
