<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post-it - Download</title>
  <meta name="description" content="Baixe o Post-it - App de lembretes simples e elegante para Android">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fef3c7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border: 4px solid #000;
      box-shadow: 8px 8px 0 0 #000;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      image-rendering: pixelated;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #000;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #525252;
      margin-bottom: 32px;
      font-size: 16px;
      line-height: 1.5;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: #facc15;
      border: 4px solid #000;
      color: #000;
      padding: 18px 28px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 6px 6px 0 0 #000;
    }
    .download-btn:hover {
      background: #eab308;
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 0 #000;
    }
    .download-btn:active {
      transform: translate(6px, 6px);
      box-shadow: 0 0 0 0 #000;
    }
    .download-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.5;
    }
    .features {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 3px solid #000;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 0;
      color: #404040;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      border-bottom: 1px solid #e5e5e5;
    }
    .feature:last-child {
      border-bottom: none;
    }
    .feature svg {
      width: 22px;
      height: 22px;
      color: #000;
      flex-shrink: 0;
      stroke-width: 2.5;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="https://raw.githubusercontent.com/pedrogottardi/post-it/main/public/icons/icon-192.png" alt="Post-it Logo">
    </div>
    <h1>Post-it</h1>
    <p class="subtitle">Lembretes simples, rápidos e sem distrações para Android</p>

    <a href="https://github.com/pedrogottardi/post-it/releases" class="download-btn" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Baixar APK
    </a>

    <div class="features">
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        Lembretes com data e hora
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        Calendário visual mensal
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
        </svg>
        Backup e Importar JSON
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        Notificações locais
      </div>
    </div>
  </div>

  <script>
    // No version badge needed - link goes to releases page
  </script>
</body>
</html>
